<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8" />
<title>Versuri - Biserica Speranța</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1d3557">
<script src="/assets/theme.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="/assets/site.css">
<style>
  html, body { height: auto; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  body { font-size: 17px; }

  /* Toolbar: big touch targets for tablets on stage */
  #topBar { padding: 0.6rem 0; }
  #topBar .container-xl { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; }
  #topBar .btn { min-height: 48px; padding: 0.5rem 1rem; font-size: 1rem; touch-action: manipulation; }
  #topBar .btn-group .btn { min-width: 52px; font-size: 1.1rem; }
  #authArea { margin-left: auto; display: flex; align-items: center; gap: 0.5rem; }
  #authArea .who { color: var(--sp-muted); font-size: 0.95rem; }
  #adminMenu .dropdown-item { font-size: 1rem; padding: 0.7rem 0.9rem; }

  /* List panel */
  .listCard { padding: 1rem 1.25rem; }
  .listBar { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; margin-bottom: 0.75rem; }
  .listBar #listPicker { width: auto; max-width: 100%; font-weight: 600; min-height: 44px; }
  .listBar .btn { min-height: 44px; }
  .listMeta { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; font-size: 0.85rem; }
  .listMeta a { text-decoration: none; }
  #selectedEmpty { color: var(--sp-muted); font-style: italic; font-size: 0.95rem; }
  #selectedList { margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 0.5rem; }
  #selectedList li { list-style: none; display: flex; align-items: center; gap: 2px; }
  #selectedList a {
    display: inline-block; padding: 0.45rem 1rem;
    background: var(--sp-surface); border: 1px solid var(--sp-border); border-radius: 999px;
    color: var(--sp-text); text-decoration: none; font-size: 0.95rem; font-weight: 500;
    transition: all 0.12s;
  }
  #selectedList a:hover { border-color: var(--sp-navy); color: var(--sp-navy); }
  #selectedList a.current { background: var(--sp-navy); border-color: var(--sp-navy); color: #fff; }
  [data-bs-theme="dark"] #selectedList a.current { color: #10141c; }
  #selectedList li.dragging { opacity: 0.4; }
  #selectedList .dragHandle { cursor: grab; color: var(--sp-muted); font-size: 20px; padding: 6px 6px; touch-action: none; user-select: none; }
  #selectedList .removeBtn {
    width: 32px; height: 32px; margin-left: 2px; border-radius: 50%;
    border: 1px solid var(--sp-border); background: var(--sp-surface);
    color: var(--sp-muted); font-size: 20px; line-height: 1; padding: 0;
    display: inline-grid; place-items: center; touch-action: manipulation; cursor: pointer;
  }
  #selectedList .removeBtn:hover { color: #dc3545; border-color: #dc3545; background: color-mix(in srgb, #dc3545 8%, var(--sp-surface)); }

  /* Key bar */
  .keyBar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 1rem;
    background: var(--sp-gold-soft); border: 1px solid color-mix(in srgb, var(--sp-gold) 45%, transparent);
    border-radius: var(--bs-border-radius-lg); padding: 0.6rem 1.25rem; margin-top: 1rem; font-size: 1rem;
  }
  .keyBar b { color: var(--sp-chord); font-family: 'Courier New', Courier, monospace; font-size: 1.2rem; }

  /* Song */
  .songCard { margin-top: 1rem; padding: 1.5rem 1.75rem; }
  #songView { font-family: 'Courier New', Courier, monospace; font-weight: bold; font-size: 20px; line-height: 1.5; }
  #songView .chordLine { color: var(--sp-chord); font-weight: 700; white-space: pre; }
  #songView hr { border: 0; border-top: 1px solid var(--sp-border); opacity: 1; margin: 1rem 0; }
  #songView:empty::before { content: "Alege o cântare din listă sau din ☰ Cântări."; color: var(--sp-muted); font-family: system-ui, sans-serif; font-weight: 400; }

  /* Chords editor */
  .chordsEditRow { margin-bottom: 12px; }
  .chordsInputRow { display: flex; gap: 6px; align-items: center; margin-bottom: 4px; }
  .chordsInputRow .chordsInput { flex: 1; min-height: 40px; font-family: 'Courier New', Courier, monospace; }
  .chordsInputRow button { min-width: 44px; min-height: 40px; font-size: 18px; border: 1px solid var(--sp-border); background: var(--sp-surface); border-radius: 0.5rem; touch-action: manipulation; }
  .chordsEditRow .lyricLine { font-family: 'Courier New', Courier, monospace; padding: 4px 8px; background: var(--bs-tertiary-bg); border-radius: 0.4rem; }
  #chordsEditor hr { border: 0; border-top: 2px dashed var(--sp-border); opacity: 1; margin: 16px 0; }
  .modal .form-label { font-weight: 500; margin-bottom: 0.3rem; }

  @media (max-width: 768px) {
    #songView { font-size: 18px; }
    .songCard { padding: 1rem 1.1rem; }
    #topBar .btn { padding: 0.5rem 0.75rem; }
  }
</style>
</head>
<body>
<nav class="sp-navbar sticky-top" id="topBar">
  <div class="container-xl">
    <a class="sp-brand text-decoration-none me-1" href="/" title="Acasă"><span class="sp-brand-mark">✝</span></a>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#songsModal">☰ Cântări</button>
    <div class="d-flex align-items-center">
      <div class="btn-group" role="group" aria-label="Transpose">

      </div>
    </div>
    <div class="d-flex align-items-center">
      <div class="btn-group" role="group" aria-label="Font size">
        <button class="btn btn-soft" onclick="fontAdjust(-1)" title="Smaller">A−</button>
        <button class="btn btn-soft" onclick="fontAdjust(1)" title="Bigger">A+</button>
      </div>
    </div>
    <div class="dropdown" id="adminMenu" style="display:none">
      <button class="btn btn-gold dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">Admin</button>
      <ul class="dropdown-menu">
        <li><button class="dropdown-item" id="editSongBtn" onclick="openEditSongModal()">✏️ Edit Song</button></li>
        <li><button class="dropdown-item" id="editChordsBtn" onclick="openEditChordsModal()">🎸 Edit Chords</button></li>
        <li><button class="dropdown-item" id="selectBtn" onclick="addSelected()">Add to Selected</button></li>
        <li><button class="dropdown-item" id="sangBtn" onclick="markSang()">✅ Mark Sung Today</button></li>
        <li><button class="dropdown-item" id="publishBtn" onclick="publishSong()">📺 Publish</button></li>
        <li><hr class="dropdown-divider"></li>
        <li><button class="dropdown-item" onclick="openNewSongModal()">➕ New Song</button></li>
      </ul>
    </div>
    <div id="authArea"></div>
  </div>
</nav>

<main class="container-xl py-3">
  <div class="sp-card listCard">
    <div class="listBar">
      <select id="listPicker" class="form-select" onchange="switchList(this.value)">
        <option value="0">Selected</option>
      </select>
      <button class="btn btn-soft adminOnly" style="display:none" onclick="openNewServiceModal()">+ Service</button>
      <button class="btn btn-outline-danger adminOnly" id="deleteServiceBtn" style="display:none" onclick="deleteService()">Delete service</button>
      <div class="listMeta ms-auto">
        <span id="offlineStatus"></span>
        <a href="/api/selected/export" id="exportSelectedBtn" style="display:none">⬇ Export for ProPresenter</a>
      </div>
    </div>
    <ul id="selectedList"></ul>
  </div>
  <div id="keyBar" class="keyBar" style="display:none"></div>
  <div class="sp-card songCard">
    <div id="songView"></div>
  </div>
</main>

<!-- Songs Menu Modal -->
<div class="modal fade" id="songsModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">Cântări</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
    <div class="modal-body">
      <div class="d-flex flex-wrap gap-2 mb-3">
        <input class="form-control flex-grow-1" style="min-width:200px" id="searchBox" placeholder="Caută..." oninput="renderSongList()">
        <button class="btn btn-gold" id="newSongBtn" style="display:none" onclick="openNewSongModal()">+ New Song</button>
        <a href="/versuri/all/" class="btn btn-soft">Toate tipurile</a>
      </div>
      <table class="table sp-table" id="songList">
        <thead><tr>
          <th class="sortableCol" data-key="songName">Name</th>
          <th class="sortableCol" data-key="baseKey">Key</th>
          <th class="sortableCol" data-key="songType">Type</th>

          <th class="sortableCol" data-key="lastSang">Last Sang</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div></div>
</div>

<!-- New Service Modal -->
<div class="modal fade" id="newServiceModal" tabindex="-1">
  <div class="modal-dialog"><div class="modal-content">

<!-- Login Modal -->

  <div class="modal-dialog modal-dialog-centered"><div class="modal-content">

<!-- Edit Song (lyrics) Modal -->
<div class="modal fade" id="editSongModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">Editează Versurile</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>

<!-- Edit Chords Modal -->
<div class="modal fade" id="editChordsModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">Editează Acordurile</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
    <div class="modal-body">
      <div id="chordsEditor"></div>
    </div>
    <div class="modal-footer"><button class="btn btn-primary" onclick="saveChords()">Save Chords</button></div>
  </div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
let me = { loggedIn: false };
let allSongs = [];
let currentSong = null;

function $(id) { return document.getElementById(id); }
function modal(id) { return bootstrap.Modal.getOrCreateInstance($(id)); }

async function api(path, opts) {
  const res = await fetch(path, { credentials: "include", headers: { "Content-Type": "application/json" }, ...opts });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.error || res.statusText);
  }
  return res.status === 204 ? null : res.json();
}

function renderAuthArea() {
  const el = $("authArea");
  if (me.loggedIn) {
    el.innerHTML = `<span class="who d-none d-sm-inline">${escapeHtml(me.title || "")}</span><button class="btn btn-soft" onclick="doLogout()">Log Out</button>`;
  } else {
    el.innerHTML = `<button class="btn btn-soft" data-bs-toggle="modal" data-bs-target="#loginModal">Login</button>`;
  }
  const showAdmin = me.loggedIn && me.permission && me.permission.includes("admin");
  $("adminMenu").style.display = showAdmin ? "block" : "none";
  $("newSongBtn").style.display = showAdmin ? "inline-block" : "none";
  if (typeof selectedSongs !== "undefined") renderSelected();
  if (typeof renderListControls !== "undefined") renderListControls();
}

async function refreshMe() {
  try { me = await api("/api/me"); } catch (e) { me = { loggedIn: false }; }
  renderAuthArea();
}

async function doLogin() {
  try {
    me = await api("/api/login", { method: "POST", body: JSON.stringify({ username: $("loginUser").value, password: $("loginPass").value }) });
    $("loginError").textContent = "";
    modal("loginModal").hide();
    renderAuthArea();
  } catch (e) {
    $("loginError").textContent = e.message;
  }
}

async function doLogout() {
  await api("/api/logout", { method: "POST" });
  me = { loggedIn: false };
  renderAuthArea();
}

async function loadSongs() {
  try {
    allSongs = await api("/api/songs");
    try { localStorage.setItem("versuriOffline:songs", JSON.stringify(allSongs)); } catch (e) {}
  } catch (e) {
    allSongs = JSON.parse(localStorage.getItem("versuriOffline:songs") || "[]");
  }
  renderSongList();
}

let sortState = { key: "songName", dir: 1 };

function sortSongs(list) {
  const { key, dir } = sortState;
  return [...list].sort((a, b) => {
    let av = a[key], bv = b[key];
    if (key === "sangCount") { av = av || 0; bv = bv || 0; }
    if (key === "lastSang" || key === "baseKey") { av = av || ""; bv = bv || ""; }
    if (typeof av === "string") av = av.toLowerCase();
    if (typeof bv === "string") bv = bv.toLowerCase();
    if (av < bv) return -1 * dir;
    if (av > bv) return 1 * dir;
    return 0;
  });
}

function setSort(key) {
  if (sortState.key === key) sortState.dir *= -1;
  else sortState = { key, dir: 1 };
  renderSongList();
}

document.addEventListener("DOMContentLoaded", () => {
  document.querySelectorAll("#songList th.sortableCol").forEach((th) => {
    th.style.cursor = "pointer";
    th.onclick = () => setSort(th.dataset.key);
  });
});

function renderSongList() {
  const q = $("searchBox").value.toLowerCase();
  const tbody = document.querySelector("#songList tbody");
  tbody.innerHTML = "";
  document.querySelectorAll("#songList th.sortableCol").forEach((th) => {
    th.classList.toggle("sorted", th.dataset.key === sortState.key);
    th.classList.toggle("desc", th.dataset.key === sortState.key && sortState.dir < 0);
  });
  sortSongs(allSongs.filter((s) => s.songName.toLowerCase().includes(q))).forEach((s) => {
    const lastSang = s.lastSang ? s.lastSang.slice(0, 10) : "";
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${s.songName}</td><td>${s.baseKey || ""}</td><td>${s.songType || ""}</td><td>${s.sangCount || 0}</td><td>${lastSang}</td>`;
    tr.onclick = () => { loadSong(s.songId); modal("songsModal").hide(); };
    tbody.appendChild(tr);
  });
}

let selectedSongs = [];
let dragEl = null;
let dragStartX = 0, dragStartY = 0, dragMoved = false;

// Which song list the panel shows: 0 = "Selected", otherwise a pre-planned service id.
let currentList = 0;
let services = [];

function listUrl(suffix = "") {
  return currentList ? `/api/services/${currentList}${suffix}` : `/api/selected${suffix}`;
}
function listSongsUrl() { return currentList ? listUrl("/songs") : listUrl(); }
function listSongUrl(songId) { return currentList ? listUrl(`/songs/${songId}`) : listUrl(`/${songId}`); }

function todayIso() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

function serviceLabel(s) {
  const [y, m, d] = s.serviceDate.split("-");
  let label = `${d}.${m}.${y}`;
  if (s.serviceName) label += ` – ${s.serviceName}`;
  if (s.serviceDate === todayIso()) label += " (azi)";
  return label;
}

function currentListName() {
  const s = services.find((x) => x.serviceId === currentList);
  return s ? serviceLabel(s) : "Selected";
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

async function loadServices() {
  try {
    services = await api("/api/services");
    localStorage.setItem("versuriOffline:services", JSON.stringify(services));
  } catch (e) {
    services = JSON.parse(localStorage.getItem("versuriOffline:services") || "[]");
  }
  if (currentList && !services.some((s) => s.serviceId === currentList)) currentList = 0;
  renderListControls();
}

function renderListControls() {
  const picker = $("listPicker");
  picker.innerHTML = `<option value="0">Selected</option>` +
    services.map((s) => `<option value="${s.serviceId}">${escapeHtml(serviceLabel(s))}</option>`).join("");
  picker.value = String(currentList);
  const isAdmin = me.loggedIn && me.permission && me.permission.includes("admin");
  document.querySelectorAll(".adminOnly").forEach((el) => (el.style.display = isAdmin ? "inline-block" : "none"));
  $("deleteServiceBtn").style.display = isAdmin && currentList ? "inline-block" : "none";
  $("selectBtn").textContent = currentList ? "Add to Service" : "Add to Selected";
  $("selectBtn").title = `Add to ${currentListName()}`;
}

// Today's service if there is one, else the nearest upcoming service, else "Selected".
function defaultList() {
  const today = todayIso();
  const upcoming = services
    .filter((s) => s.serviceDate >= today)
    .sort((a, b) => a.serviceDate.localeCompare(b.serviceDate) || a.serviceId - b.serviceId);
  return upcoming.length ? upcoming[0].serviceId : 0;
}

async function switchList(value) {
  currentList = parseInt(value, 10) || 0;
  renderListControls();
  await loadSelected();
}

function openNewServiceModal() {
  $("newServiceDate").value = "";
  $("newServiceName").value = "";
  $("newServiceError").textContent = "";
  modal("newServiceModal").show();
}

async function saveNewService() {
  try {
    const res = await api("/api/services", {
      method: "POST",
      body: JSON.stringify({ date: $("newServiceDate").value, name: $("newServiceName").value }),
    });
    modal("newServiceModal").hide();
    await loadServices();
    await switchList(res.serviceId);
  } catch (e) {
    $("newServiceError").textContent = e.message;
  }
}

async function deleteService() {
  if (!currentList) return;
  if (!confirm(`Delete the service "${currentListName()}"? The songs themselves are not deleted.`)) return;
  await api(`/api/services/${currentList}`, { method: "DELETE" });
  await loadServices();
  await switchList(0);
}

// ---- Offline support ----
// When a list loads, every song in it (lyrics + chords) is fetched in one call
// and kept in songCache, so switching songs needs no network. The list is also
// saved to localStorage so it still works if the connection drops later.
const songCache = {};
let offlineMode = false;

function offlineKey(list) { return `versuriOffline:${list}`; }

function saveOfflineList() {
  const full = selectedSongs.map((s) => songCache[s.songId]).filter(Boolean);
  try {
    localStorage.setItem(offlineKey(currentList), JSON.stringify({ songs: selectedSongs, full, savedAt: Date.now() }));
  } catch (e) { /* storage full: in-memory cache still works */ }
}

function loadOfflineList() {
  try {
    const saved = JSON.parse(localStorage.getItem(offlineKey(currentList)) || "null");
    if (!saved) return false;
    selectedSongs = saved.songs;
    saved.full.forEach((s) => (songCache[s.songId] = s));
    return saved.savedAt;
  } catch (e) { return false; }
}

function setOfflineStatus(text, warn) {
  const el = $("offlineStatus");
  el.textContent = text;
  el.style.color = warn ? "#b45309" : "#2e7d32";
}

async function removeFromList(songId) {
  const song = selectedSongs.find((s) => s.songId === songId);
  if (!song || !confirm(`Remove "${song.songName}" from ${currentListName()}?`)) return;
  try {
    await api(listSongUrl(songId), { method: "DELETE" });
  } catch (e) {
    alert(`Could not remove the song: ${e.message}`);
    return;
  }
  await loadSelected();
  if (currentList) loadServices();
}

async function loadSelected() {
  try {
    const [list, full] = await Promise.all([api(listSongsUrl()), api(listUrl("/full"))]);
    full.forEach((s) => (songCache[s.songId] = s));
    selectedSongs = list;
    offlineMode = false;
    saveOfflineList();
    setOfflineStatus(list.length ? `✓ ${list.length} songs ready offline` : "", false);
  } catch (e) {
    const savedAt = loadOfflineList();
    offlineMode = true;
    if (savedAt) {
      setOfflineStatus(`Offline – saved copy from ${new Date(savedAt).toLocaleString("ro-RO")}`, true);
    } else {
      selectedSongs = [];
      setOfflineStatus("Offline – this list was not saved on this device", true);
    }
  }
  renderSelected();
}

function renderSelected() {
  const ul = $("selectedList");
  ul.innerHTML = "";
  $("exportSelectedBtn").style.display = selectedSongs.length ? "inline" : "none";
  $("exportSelectedBtn").href = listUrl("/export");
  if (!selectedSongs.length && currentList) {
    ul.innerHTML = `<li id="selectedEmpty">No songs in this service yet.</li>`;
  }
  const isAdmin = me.loggedIn && me.permission && me.permission.includes("admin");
  selectedSongs.forEach((s) => {
    const li = document.createElement("li");
    li.dataset.songId = s.songId;
    const handle = isAdmin ? `<span class="dragHandle" title="Drag to reorder">⠿</span>` : "";
    const remove = isAdmin ? `<button type="button" class="removeBtn" title="Remove from list" aria-label="Remove ${escapeHtml(s.songName)}" onclick="removeFromList(${s.songId})">×</button>` : "";
    const cur = currentSong && currentSong.songId === s.songId ? " class=\"current\"" : "";
    li.innerHTML = `${handle}<a href="#"${cur} onclick="loadSong(${s.songId});return false;">${s.songName}</a>${remove}`;
    if (isAdmin) {
      const handleEl = li.querySelector(".dragHandle");
      handleEl.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        dragEl = li;
        dragStartX = e.clientX;
        dragStartY = e.clientY;
        dragMoved = false;
        li.classList.add("dragging");
        handleEl.setPointerCapture(e.pointerId);
      });
    }
    ul.appendChild(li);
  });
}

function closestSelectedLi(x, y) {
  const els = [...document.querySelectorAll("#selectedList li:not(.dragging)")];
  let closest = null, closestDist = Infinity;
  for (const el of els) {
    const box = el.getBoundingClientRect();
    const dist = Math.hypot(x - (box.left + box.width / 2), y - (box.top + box.height / 2));
    if (dist < closestDist) { closestDist = dist; closest = { el, box }; }
  }
  return closest;
}

document.addEventListener("pointermove", (e) => {
  if (!dragEl) return;
  if (!dragMoved && Math.hypot(e.clientX - dragStartX, e.clientY - dragStartY) > 8) dragMoved = true;
  if (!dragMoved) return;
  const target = closestSelectedLi(e.clientX, e.clientY);
  if (!target) return;
  const before = e.clientX < target.box.left + target.box.width / 2;
  target.el.parentNode.insertBefore(dragEl, before ? target.el : target.el.nextSibling);
});

document.addEventListener("pointerup", async () => {
  if (!dragEl) return;
  const songId = parseInt(dragEl.dataset.songId, 10);
  const moved = dragMoved;
  dragEl.classList.remove("dragging");
  dragEl = null;

  if (!moved) return; // a tap on the handle does nothing; × removes

  const ids = [...document.querySelectorAll("#selectedList li")].map((li) => parseInt(li.dataset.songId, 10));
  selectedSongs = ids.map((id) => selectedSongs.find((s) => s.songId === id));
  await api(listUrl("/reorder"), { method: "PUT", body: JSON.stringify({ songIds: ids }) });
});

// Shows a song from songCache when it is there (no network call);
// otherwise fetches it. force = true refetches, e.g. after an edit.
async function loadSong(songId, force = false) {
  let song = force ? null : songCache[songId];
  if (!song) {
    try {
      song = await api(`/api/songs/${songId}`);
      songCache[songId] = song;
      if (selectedSongs.some((s) => s.songId === songId)) saveOfflineList();
    } catch (e) {
      song = songCache[songId];
      if (!song) {
        $("songView").innerHTML = `<p class="text-muted">This song is not available offline. Reconnect to load it.</p>`;
        return;
      }
    }
  }
  currentSong = song;
  history.replaceState(null, "", `?song=${songId}`);
  document.title = currentSong.songName;
  renderSong();
}

function renderKeyBar() {
  const bar = $("keyBar");
  if (!currentSong) { bar.style.display = "none"; return; }
  const base = (currentSong.baseKey || "").trim();
  bar.innerHTML = `<span>Base key: <b>${base ? escapeHtml(base) : "—"}</b></span>`;
  bar.style.display = "flex";
}

function renderSong() {
  renderKeyBar();
  renderSelected();
  const steps = transposeBy[currentSong.songId] || 0;
  const chordMap = {};
  currentSong.chords.forEach((c) => (chordMap[`${c.stanzaNumber}-${c.lineNumber}`] = c.chords));
  const lines = currentSong.songContent.split("\n");
  let stanza = 0, lineNum = 1;
  const out = [];
  for (const line of lines) {
    if (line.trim() === "") {
      stanza++; lineNum = 1;
      out.push(`<hr>`);
      continue;
    }
    const chords = chordMap[`${stanza}-${lineNum}`];
    if (chords && chords.replace(/[\[\]]/g, "").trim() !== "") {
      const display = transposeLine(chords, steps).replace(/\[\]/g, "  ");
      out.push(`<div class="chordLine">${display}</div>`);
    }
    out.push(`<div>${line}</div>`);
    lineNum++;
  }
  $("songView").innerHTML = out.join("");
}

// ---- Transpose ----
// Semitones each song is transposed by. Kept in memory only, so a song stays
// transposed while switching between songs, and resets when the page is refreshed.
const transposeBy = {};
const NOTE_ORDER = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const FLAT_TO_SHARP = { Ab:"G#", Bb:"A#", Db:"C#", Eb:"D#", Gb:"F#" };

function transposeChord(token, up) {
  let m = token.match(/^([A-G][#b]?)(m?)(7?)(?:\/([A-G][#b]?)(m?)(7?))?$/);
  if (!m) return token;
  function shift(note) {
    note = FLAT_TO_SHARP[note] || note;
    let idx = NOTE_ORDER.indexOf(note);
    if (idx === -1) return note;
    idx = (idx + (up ? 1 : -1) + 12) % 12;
    return NOTE_ORDER[idx];
  }
  let result = shift(m[1]) + m[2] + m[3];
  if (m[4]) result += "/" + shift(m[4]) + m[5] + m[6];
  return result;
}

function transposeSteps(token, steps) {
  const up = steps > 0;
  for (let i = 0; i < Math.abs(steps); i++) token = transposeChord(token, up);
  return token;
}

function transposeLine(chords, steps) {
  if (!steps) return chords;
  return chords.replace(/\[([^\]]*)\]/g, (full, inner) =>
    inner.trim() ? "[" + transposeSteps(inner.trim(), steps) + "]" : full
  );
}

function transpose(direction) {
  if (!currentSong) return;
  const id = currentSong.songId;
  // Keep within one octave: +12 is the same key as 0.
  let steps = ((transposeBy[id] || 0) + direction) % 12;
  if (steps > 6) steps -= 12;
  if (steps < -6) steps += 12;
  transposeBy[id] = steps;
  renderSong();
}

function fontAdjust(delta) {
  const el = $("songView");
  const current = parseInt(getComputedStyle(el).fontSize) || 16;
  el.style.fontSize = (current + delta) + "px";
}

async function markSang() {
  if (!currentSong) return;
  if (!confirm(`Mark "${currentSong.songName}" as sung today?`)) return;
  await api(`/api/songs/${currentSong.songId}/sang`, { method: "POST" });
  alert("Marked as sung today");
}

async function addSelected() {
  if (!currentSong) return;
  await api(listSongsUrl(), { method: "POST", body: JSON.stringify({ songId: currentSong.songId }) });
  loadSelected();
  if (currentList) loadServices();
}

async function publishSong() {
  if (!currentSong) return;
  await api("/api/published", { method: "POST", body: JSON.stringify({ songId: currentSong.songId }) });
  alert(`Published "${currentSong.songName}"`);
}

function openNewSongModal() {
  modal("newSongModal").show();
}

async function saveNewSong() {
  await api("/api/songs", {
    method: "POST",
    body: JSON.stringify({ name: $("newSongTitle").value, content: $("newSongContent").value, type: $("newSongType").value, baseKey: $("newSongBaseKey").value }),
  });
  modal("newSongModal").hide();
  loadSongs();
}

function openEditSongModal() {
  if (!currentSong) return;
  $("editContent").value = currentSong.songContent;
  $("editBaseKey").value = currentSong.baseKey || "";
  const typeSelect = $("editType");
  if (currentSong.songType && ![...typeSelect.options].some((o) => o.value === currentSong.songType)) {
    const opt = document.createElement("option");
    opt.value = currentSong.songType;
    opt.textContent = currentSong.songType;
    typeSelect.appendChild(opt);
  }
  typeSelect.value = currentSong.songType || "other";
  modal("editSongModal").show();
}

let chordsClipboard = "";

function copyChords(btn) {
  const input = btn.closest(".chordsInputRow").querySelector(".chordsInput");
  chordsClipboard = input.value;
}

function pasteChords(btn) {
  const input = btn.closest(".chordsInputRow").querySelector(".chordsInput");
  input.value = chordsClipboard;
}

function openEditChordsModal() {
  if (!currentSong) return;
  const editor = $("chordsEditor");
  editor.innerHTML = "";
  const lines = currentSong.songContent.split("\n");
  const chordMap = {};
  currentSong.chords.forEach((c) => (chordMap[`${c.stanzaNumber}-${c.lineNumber}`] = c.chords));
  let stanza = 0, lineNum = 1;
  lines.forEach((line) => {
    if (line.trim() === "") {
      stanza++; lineNum = 1;
      editor.appendChild(document.createElement("hr"));
      return;
    }
    const row = document.createElement("div");
    row.className = "chordsEditRow";
    row.dataset.stanza = stanza;
    row.dataset.line = lineNum;
    const chordsVal = (chordMap[`${stanza}-${lineNum}`] || "").replace(/"/g, "&quot;");
    row.innerHTML = `
      <div class="chordsInputRow">
        <input class="form-control chordsInput" value="${chordsVal}">
        <button type="button" class="chordsCopyBtn" title="Copy" onclick="copyChords(this)">📋</button>
        <button type="button" class="chordsPasteBtn" title="Paste" onclick="pasteChords(this)">📥</button>
      </div>
      <div class="lyricLine">${line}</div>`;
    editor.appendChild(row);
    lineNum++;
  });
  modal("editChordsModal").show();
}

async function deleteSong() {
  if (!currentSong) return;
  if (!confirm(`Delete "${currentSong.songName}"? This cannot be undone.`)) return;
  if (!confirm(`Are you absolutely sure? Type OK to permanently delete "${currentSong.songName}" and its chords.`)) return;
  await api(`/api/songs/${currentSong.songId}`, { method: "DELETE" });
  delete songCache[currentSong.songId];
  modal("editSongModal").hide();
  currentSong = null;
  $("songView").innerHTML = "";
  history.replaceState(null, "", location.pathname);
  await loadSongs();
  if (allSongs.length) loadSong(allSongs[0].songId);
}

async function saveContent() {
  await api(`/api/songs/${currentSong.songId}`, {
    method: "PUT",
    body: JSON.stringify({ content: $("editContent").value, type: $("editType").value, baseKey: $("editBaseKey").value }),
  });
  modal("editSongModal").hide();
  loadSong(currentSong.songId, true);
  loadSongs();
}

async function saveChords() {
  const entries = [];
  document.querySelectorAll("#chordsEditor .chordsEditRow").forEach((row) => {
    entries.push({ stanza: parseInt(row.dataset.stanza), line: parseInt(row.dataset.line), chords: row.querySelector(".chordsInput").value });
  });
  await api(`/api/songs/${currentSong.songId}/chords`, { method: "POST", body: JSON.stringify({ entries }) });
  modal("editChordsModal").hide();
  loadSong(currentSong.songId, true);
}

if ("serviceWorker" in navigator) navigator.serviceWorker.register("/versuri/sw.js").catch(() => {});

(async function init() {
  await refreshMe();
  await loadSongs();
  const params = new URLSearchParams(location.search);
  // A ?list= link wins; otherwise open today's service, or the next upcoming one.
  currentList = parseInt(params.get("list") || "0", 10) || 0;
  await loadServices();
  if (!currentList) currentList = defaultList();
  renderListControls();
  await loadSelected();
  const songParam = params.get("song");
  if (songParam) loadSong(parseInt(songParam, 10));
})();
</script>
