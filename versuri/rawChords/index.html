<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8" />
<title>Versuri</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { height: 100%; margin: 0; background: #05070b; color: #f5f6f8; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #songView {
    font-family: 'Courier New', Courier, monospace;
    font-weight: bold;
    font-size: 32px;
    line-height: 1.6;
    padding: 32px;
    max-width: 900px;
    margin: 0 auto;
  }
  #songView .chordLine { color: #ff6b6b; font-weight: 700; white-space: pre; }
  #songView hr { border: none; border-top: 1px solid #1f2633; margin: 24px 0; }
  @media (max-width: 768px) {
    #songView { font-size: 24px; padding: 16px; }
  }
</style>
</head>
<body>
<div id="songView"></div>
<script>
let lastSongId = null;
let currentSong = null;

async function poll() {
  try {
    const res = await fetch("/api/published");
    const data = await res.json();
    if (data.songId && data.songId !== lastSongId) {
      lastSongId = data.songId;
      await showSong(data.songId);
    } else if (!data.songId && lastSongId !== null) {
      lastSongId = null;
      currentSong = null;
      document.getElementById("songView").innerHTML = "";
    }
  } catch (e) {
    // ignore transient network errors, keep showing last content
  }
}

async function showSong(songId) {
  const res = await fetch(`/api/songs/${songId}`);
  if (!res.ok) return;
  currentSong = await res.json();
  render();
}

function render() {
  if (!currentSong) return;
  const chordMap = {};
  currentSong.chords.forEach((c) => (chordMap[`${c.stanzaNumber}-${c.lineNumber}`] = c.chords));
  const lines = currentSong.songContent.split("\n");
  let stanza = 0, lineNum = 1;
  const out = [];
  for (const line of lines) {
    if (line.trim() === "") {
      stanza++; lineNum = 1;
      out.push("<hr>");
      continue;
    }
    const chords = chordMap[`${stanza}-${lineNum}`];
    if (chords && chords.replace(/[\[\]]/g, "").trim() !== "") {
      const display = chords.replace(/\[\]/g, "  ");
      out.push(`<div class="chordLine">${display}</div>`);
    }
    out.push(`<div>${line}</div>`);
    lineNum++;
  }
  document.getElementById("songView").innerHTML = out.join("");
}

poll();
setInterval(poll, 3000);
</script>
</body>
</html>
