<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8" />
<title>Versuri - Biserica Speranța</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css">
<style>
  html, body { height: auto; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  body { font-size: 18px; }
  #songView { font-family: 'Courier New', Courier, monospace; font-weight: bold; font-size: 20px; line-height: 1.5; }
  #songView .chordLine { color: gray; font-weight: 600; white-space: pre; }
  #songList tr { cursor: pointer; }
  #songList td { padding: 10px 8px; }
  .btn-toolbar .btn, #newSongBtn { min-height: 44px; padding: 10px 16px; font-size: 16px; margin: 4px; touch-action: manipulation; }
  input, textarea, select { font-size: 16px; min-height: 40px; }
  .chordsEditRow { margin-bottom: 12px; }
  .chordsEditRow input { width: 100%; min-height: 40px; margin-bottom: 4px; font-family: 'Courier New', Courier, monospace; }
  .chordsEditRow .lyricLine { font-family: 'Courier New', Courier, monospace; padding: 4px 8px; background: #f5f5f5; border-radius: 4px; }
  .modal-dialog { margin: 1rem auto; }
  #selectedList li { padding: 8px 0; }
  #selectedList a { display: block; padding: 6px 0; }
  @media (max-width: 768px) {
    .container-fluid { padding-left: 8px; padding-right: 8px; }
    #songView { font-size: 18px; }
  }
</style>
</head>
<body>
<div class="container-fluid">
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <button class="btn btn-outline-primary" data-toggle="modal" data-target="#songsModal">☰ Songs</button>
    <div id="authArea"></div>
  </nav>

  <div class="row" style="margin-top: 10px;">
    <div class="col-12">
      <div class="btn-toolbar" style="margin-bottom: 10px;">
        <button class="btn btn-sm btn-outline-secondary" onclick="transpose(-1)">Down ♭</button>
        <button class="btn btn-sm btn-outline-secondary" onclick="transpose(1)">Up ♯</button>
        <button class="btn btn-sm btn-outline-secondary" onclick="fontAdjust(-1)">A-</button>
        <button class="btn btn-sm btn-outline-secondary" onclick="fontAdjust(1)">A+</button>
        <button class="btn btn-sm btn-outline-primary" id="editSongBtn" style="display:none" onclick="openEditSongModal()">Edit Song</button>
        <button class="btn btn-sm btn-outline-primary" id="editChordsBtn" style="display:none" onclick="openEditChordsModal()">Edit Chords</button>
        <button class="btn btn-sm btn-outline-success" id="sangBtn" style="display:none" onclick="markSang()">Mark Sung Today</button>
        <button class="btn btn-sm btn-outline-info" id="selectBtn" style="display:none" onclick="addSelected()">Add to Selected</button>
      </div>
      <h5>Selected</h5>
      <ul id="selectedList" class="list-unstyled"></ul>
      <h4 id="songTitle"></h4>
      <div id="songView"></div>
    </div>
  </div>
</div>

<!-- Songs Menu Modal -->
<div class="modal" id="songsModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content">
    <div class="modal-header"><h5>Songs</h5><button class="close" data-dismiss="modal">&times;</button></div>
    <div class="modal-body">
      <button class="btn btn-sm btn-success" id="newSongBtn" style="display:none" onclick="openNewSongModal()">+ New Song</button>
      <input class="form-control" id="searchBox" placeholder="Search..." oninput="renderSongList()">
      <table class="table" id="songList">
        <thead><tr><th>Name</th><th>Sang Count</th><th>Last Sang</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div></div>
</div>

<!-- Login Modal -->
<div class="modal" id="loginModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-scrollable"><div class="modal-content">
    <div class="modal-header"><h5>Autentificare</h5><button class="close" data-dismiss="modal">&times;</button></div>
    <div class="modal-body">
      <input class="form-control" id="loginUser" placeholder="Utilizator" style="margin-bottom:8px;">
      <input class="form-control" id="loginPass" type="password" placeholder="Parola">
      <div id="loginError" class="text-danger" style="margin-top:8px;"></div>
    </div>
    <div class="modal-footer"><button class="btn btn-primary" onclick="doLogin()">Autentifica</button></div>
  </div></div>
</div>

<!-- New Song Modal -->
<div class="modal" id="newSongModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-scrollable"><div class="modal-content">
    <div class="modal-header"><h5>Cântarea Nouă</h5><button class="close" data-dismiss="modal">&times;</button></div>
    <div class="modal-body">
      <input class="form-control" id="newSongTitle" placeholder="Titlul" style="margin-bottom:8px;">
      <textarea class="form-control" id="newSongContent" rows="10" placeholder="Conținut"></textarea>
      <select class="form-control" id="newSongType" style="margin-top:8px;">
        <option value="obste">Obste</option>
        <option value="christmas">Christmas</option>
        <option value="harvest">Harvest</option>
        <option value="easter">Easter</option>
        <option value="newyear">New Year</option>
        <option value="pentecost">Pentecost</option>
        <option value="other">Other</option>
      </select>
    </div>
    <div class="modal-footer"><button class="btn btn-success" onclick="saveNewSong()">Save</button></div>
  </div></div>
</div>

<!-- Edit Song (lyrics) Modal -->
<div class="modal" id="editSongModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content">
    <div class="modal-header"><h5>Editează Versurile</h5><button class="close" data-dismiss="modal">&times;</button></div>
    <div class="modal-body">
      <textarea class="form-control" id="editContent" rows="14"></textarea>
    </div>
    <div class="modal-footer"><button class="btn btn-primary" onclick="saveContent()">Save</button></div>
  </div></div>
</div>

<!-- Edit Chords Modal -->
<div class="modal" id="editChordsModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content">
    <div class="modal-header"><h5>Editează Acordurile</h5><button class="close" data-dismiss="modal">&times;</button></div>
    <div class="modal-body">
      <div id="chordsEditor"></div>
    </div>
    <div class="modal-footer"><button class="btn btn-primary" onclick="saveChords()">Save Chords</button></div>
  </div></div>
</div>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.bundle.min.js"></script>
<script>
let me = { loggedIn: false };
let allSongs = [];
let currentSong = null;
const NOTE_ORDER = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const FLAT_TO_SHARP = { Ab:"G#", Bb:"A#", Db:"C#", Eb:"D#", Gb:"F#" };

function $(id) { return document.getElementById(id); }

async function api(path, opts) {
  const res = await fetch(path, { credentials: "include", headers: { "Content-Type": "application/json" }, ...opts });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.error || res.statusText);
  }
  return res.status === 204 ? null : res.json();
}

function renderAuthArea() {
  const el = $("authArea");
  if (me.loggedIn) {
    el.innerHTML = `<span class="mr-2">Logged in as ${me.title}</span> <button class="btn btn-sm btn-outline-secondary" onclick="doLogout()">Log Out</button>`;
  } else {
    el.innerHTML = `<button class="btn btn-sm btn-outline-secondary" data-toggle="modal" data-target="#loginModal">Login</button>`;
  }
  const showAdmin = me.loggedIn && me.permission && me.permission.includes("admin");
  $("editSongBtn").style.display = showAdmin ? "inline-block" : "none";
  $("editChordsBtn").style.display = showAdmin ? "inline-block" : "none";
  $("sangBtn").style.display = showAdmin ? "inline-block" : "none";
  $("selectBtn").style.display = showAdmin ? "inline-block" : "none";
  $("newSongBtn").style.display = showAdmin ? "inline-block" : "none";
}

async function refreshMe() {
  me = await api("/api/me");
  renderAuthArea();
}

async function doLogin() {
  try {
    me = await api("/api/login", { method: "POST", body: JSON.stringify({ username: $("loginUser").value, password: $("loginPass").value }) });
    $("loginError").textContent = "";
    jQuery("#loginModal").modal("hide");
    renderAuthArea();
  } catch (e) {
    $("loginError").textContent = e.message;
  }
}

async function doLogout() {
  await api("/api/logout", { method: "POST" });
  me = { loggedIn: false };
  renderAuthArea();
}

async function loadSongs() {
  allSongs = await api("/api/songs");
  renderSongList();
}

function renderSongList() {
  const q = $("searchBox").value.toLowerCase();
  const tbody = document.querySelector("#songList tbody");
  tbody.innerHTML = "";
  allSongs
    .filter((s) => s.songName.toLowerCase().includes(q))
    .forEach((s) => {
      const lastSang = s.lastSang ? s.lastSang.slice(0, 10) : "";
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${s.songName}</td><td>${s.sangCount || 0}</td><td>${lastSang}</td>`;
      tr.onclick = () => { loadSong(s.songId); jQuery("#songsModal").modal("hide"); };
      tbody.appendChild(tr);
    });
}

async function loadSelected() {
  const selected = await api("/api/selected");
  const ul = $("selectedList");
  ul.innerHTML = "";
  selected.forEach((s) => {
    const li = document.createElement("li");
    li.innerHTML = `<a href="#" onclick="loadSong(${s.songId});return false;">${s.songName}</a>`;
    ul.appendChild(li);
  });
}

async function loadSong(songId) {
  currentSong = await api(`/api/songs/${songId}`);
  history.replaceState(null, "", `?song=${songId}`);
  $("songTitle").textContent = currentSong.songName;
  document.title = currentSong.songName;
  const chordMap = {};
  currentSong.chords.forEach((c) => (chordMap[`${c.stanzaNumber}-${c.lineNumber}`] = c.chords));
  const lines = currentSong.songContent.split("\n");
  let stanza = 0, lineNum = 1;
  const out = [];
  for (const line of lines) {
    if (line.trim() === "") {
      stanza++; lineNum = 1;
      out.push(`<hr>`);
      continue;
    }
    const chords = chordMap[`${stanza}-${lineNum}`];
    if (chords && chords.replace(/[\[\]]/g, "").trim() !== "") {
      const display = chords.replace(/\[\]/g, "  ");
      out.push(`<div class="chordLine">${display}</div>`);
    }
    out.push(`<div>${line}</div>`);
    lineNum++;
  }
  $("songView").innerHTML = out.join("");
}

function transposeChord(token, up) {
  let m = token.match(/^([A-G]#?)(m?)(7?)(?:\/([A-G]#?)(m?)(7?))?$/);
  if (!m) return token;
  function shift(note) {
    note = FLAT_TO_SHARP[note] || note;
    let idx = NOTE_ORDER.indexOf(note);
    if (idx === -1) return note;
    idx = (idx + (up ? 1 : -1) + 12) % 12;
    return NOTE_ORDER[idx];
  }
  let result = shift(m[1]) + m[2] + m[3];
  if (m[4]) result += "/" + shift(m[4]) + m[5] + m[6];
  return result;
}

function transpose(direction) {
  document.querySelectorAll(".chordLine").forEach((el) => {
    el.textContent = el.textContent.replace(/\[([^\]]*)\]/g, (full, inner) => {
      if (!inner.trim()) return full;
      return "[" + transposeChord(inner, direction > 0) + "]";
    });
  });
}

function fontAdjust(delta) {
  const el = $("songView");
  const current = parseInt(getComputedStyle(el).fontSize) || 16;
  el.style.fontSize = (current + delta) + "px";
}

async function markSang() {
  if (!currentSong) return;
  await api(`/api/songs/${currentSong.songId}/sang`, { method: "POST" });
  alert("Marked as sung today");
}

async function addSelected() {
  if (!currentSong) return;
  await api("/api/selected", { method: "POST", body: JSON.stringify({ songId: currentSong.songId }) });
  loadSelected();
}

function openNewSongModal() {
  jQuery("#newSongModal").modal("show");
}

async function saveNewSong() {
  await api("/api/songs", {
    method: "POST",
    body: JSON.stringify({ name: $("newSongTitle").value, content: $("newSongContent").value, type: $("newSongType").value }),
  });
  jQuery("#newSongModal").modal("hide");
  loadSongs();
}

function openEditSongModal() {
  if (!currentSong) return;
  $("editContent").value = currentSong.songContent;
  jQuery("#editSongModal").modal("show");
}

function openEditChordsModal() {
  if (!currentSong) return;
  const editor = $("chordsEditor");
  editor.innerHTML = "";
  const lines = currentSong.songContent.split("\n");
  const chordMap = {};
  currentSong.chords.forEach((c) => (chordMap[`${c.stanzaNumber}-${c.lineNumber}`] = c.chords));
  let stanza = 0, lineNum = 1;
  lines.forEach((line) => {
    if (line.trim() === "") { stanza++; lineNum = 1; return; }
    const row = document.createElement("div");
    row.className = "chordsEditRow";
    row.dataset.stanza = stanza;
    row.dataset.line = lineNum;
    const chordsVal = (chordMap[`${stanza}-${lineNum}`] || "").replace(/"/g, "&quot;");
    row.innerHTML = `<input class="form-control chordsInput" value="${chordsVal}"><div class="lyricLine">${line}</div>`;
    editor.appendChild(row);
    lineNum++;
  });
  jQuery("#editChordsModal").modal("show");
}

async function saveContent() {
  await api(`/api/songs/${currentSong.songId}`, { method: "PUT", body: JSON.stringify({ content: $("editContent").value }) });
  jQuery("#editSongModal").modal("hide");
  loadSong(currentSong.songId);
}

async function saveChords() {
  const entries = [];
  document.querySelectorAll("#chordsEditor .chordsEditRow").forEach((row) => {
    entries.push({ stanza: parseInt(row.dataset.stanza), line: parseInt(row.dataset.line), chords: row.querySelector(".chordsInput").value });
  });
  await api(`/api/songs/${currentSong.songId}/chords`, { method: "POST", body: JSON.stringify({ entries }) });
  jQuery("#editChordsModal").modal("hide");
  loadSong(currentSong.songId);
}

(async function init() {
  await refreshMe();
  await loadSongs();
  await loadSelected();
  const params = new URLSearchParams(location.search);
  const songParam = params.get("song");
  if (songParam) loadSong(parseInt(songParam, 10));
  else if (allSongs.length) loadSong(allSongs[0].songId);
})();
</script>
</body>
</html>
